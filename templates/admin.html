<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEA WIN IA — Panel de control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-turf:#153832; --verde-turf-2:#1f4a42;
    --pergamino:#f2ebda; --pergamino-2:#e7dcc2;
    --bronce:#b6904f; --bronce-claro:#d9b877;
    --carmin:#8c2a2a; --tinta:#241b14; --hueso:#faf6ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--hueso); color:var(--tinta);
    font-family:'Archivo',sans-serif; padding:0 0 60px;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
  .mono{ font-family:'Space Mono',monospace; }
  .top{
    background:var(--verde-turf); color:var(--hueso);
    padding:26px 24px 30px;
  }
  .top .marca{
    font-family:'Fraunces',serif; font-weight:700; font-size:14px;
    letter-spacing:.06em; margin-bottom:14px;
  }
  .top .marca span{
    font-family:'Space Mono',monospace; font-size:10px; color:var(--tinta);
    background:var(--bronce-claro); padding:2px 6px; border-radius:3px;
  }
  .top h1{ font-size:clamp(26px,5vw,38px); margin:0; }
  .top p{ color:#c7d4d0; font-size:14px; margin:8px 0 0; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 20px; }

  .tarjetas{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px; margin:-22px auto 30px; max-width:900px; padding:0 20px;
  }
  .tarjeta{
    background:var(--pergamino); border:1px solid var(--pergamino-2);
    border-radius:6px; padding:18px;
  }
  .tarjeta .rotulo{
    font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.1em; opacity:.6;
  }
  .tarjeta .valor{
    font-family:'Fraunces',serif; font-size:32px; font-weight:700;
    color:var(--verde-turf); margin-top:6px; line-height:1;
  }
  .tarjeta .valor.destaca{ color:var(--carmin); }
  .tarjeta .nota{ font-size:12px; opacity:.6; margin-top:6px; }

  h2{ font-size:20px; margin:34px 0 14px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; text-align:left; padding:8px 10px;
    border-bottom:2px solid var(--pergamino-2); opacity:.65;
  }
  td{ padding:10px; border-bottom:1px solid var(--pergamino-2); vertical-align:top; }
  tr:hover td{ background:var(--pergamino); }
  .pill{
    display:inline-block; font-family:'Space Mono',monospace; font-size:10px;
    padding:2px 7px; border-radius:10px;
  }
  .pill.si{ background:var(--verde-turf); color:var(--hueso); }
  .pill.no{ background:var(--pergamino-2); color:var(--tinta); }
  .lista-caballos{ font-size:12px; line-height:1.6; }
  .lista-caballos b{ font-family:'Fraunces',serif; }
  .barra-peso{
    background:var(--pergamino-2); height:5px; border-radius:3px;
    overflow:hidden; margin-top:5px; width:120px;
  }
  .barra-peso div{ height:100%; background:var(--bronce); }
  .estado{
    font-family:'Space Mono',monospace; font-size:13px; padding:20px 0; opacity:.7;
  }
  .estado.error{ color:var(--carmin); }
  @media (max-width:600px){
    table{ font-size:12px; }
    th,td{ padding:7px 6px; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="marca">LEA WIN <span>IA</span></div>
    <h1>Panel de control</h1>
    <p>Comparación automática entre lo que pronosticó la app y lo que pasó en la pista.</p>
  </div>
</div>

<div class="tarjetas" id="tarjetas"></div>

<div class="wrap">
  <h2>Últimas carreras comparadas</h2>
  <div id="tabla-ultimas"><div class="estado">Cargando…</div></div>

  <h2>Estado del algoritmo</h2>
  <p style="font-size:13px; opacity:.7; margin-top:-6px;">
    Estos valores se ajustan solos a medida que se acumulan resultados.
  </p>
  <div id="tabla-pesos"></div>
</div>

<script>
const clave = new URLSearchParams(location.search).get('clave') || '';

async function cargar(){
  try{
    const r = await fetch('/api/admin/rendimiento?clave=' + encodeURIComponent(clave));
    const d = await r.json();
    if (!r.ok || d.ok === false) throw new Error(d.error || 'Sin acceso');
    pintarTarjetas(d);
    pintarUltimas(d.ultimas || []);
    pintarPesos(d.pesos || []);
  }catch(e){
    document.getElementById('tabla-ultimas').innerHTML =
      '<div class="estado error">' + e.message + '</div>';
  }
}

function pintarTarjetas(d){
  const t = document.getElementById('tarjetas');
  const card = (rotulo, valor, nota, destaca) => `
    <div class="tarjeta">
      <div class="rotulo">${rotulo}</div>
      <div class="valor ${destaca?'destaca':''}">${valor}</div>
      <div class="nota">${nota}</div>
    </div>`;
  t.innerHTML =
    card('Pronósticos hechos', d.total_pronosticos ?? 0, 'total acumulado') +
    card('Ya comparados', d.carreras_comparadas ?? 0, 'carreras que se corrieron') +
    card('Acierto del ganador',
         d.acierto_ganador_pct != null ? d.acierto_ganador_pct + '%' : '—',
         'veces que acertó el 1º puesto', true) +
    card('Acierto entre los 4',
         d.acierto_top4_pct != null ? d.acierto_top4_pct + '%' : '—',
         'caballos predichos que entraron');
}

function pintarUltimas(lista){
  const cont = document.getElementById('tabla-ultimas');
  if (lista.length === 0){
    cont.innerHTML = '<div class="estado">Todavía no hay carreras comparadas. ' +
      'A medida que se corran, aparecen acá solas.</div>';
    return;
  }
  let html = '<table><tr><th>Carrera</th><th>Pronosticado</th><th>Resultado real</th>' +
             '<th>Ganador</th><th>Aciertos</th></tr>';
  lista.forEach(u=>{
    const pred = u.predicho.map((n,i)=>`${i+1}º <b>${n}</b>`).join('<br>');
    const real = u.real.length
      ? u.real.map((n,i)=>`${i+1}º <b>${n}</b>`).join('<br>')
      : '—';
    html += `<tr>
      <td class="mono">${u.fecha || ''}<br>${u.hipodromo || ''}<br>Nº ${u.numero}</td>
      <td class="lista-caballos">${pred}</td>
      <td class="lista-caballos">${real}</td>
      <td><span class="pill ${u.acerto_ganador?'si':'no'}">${u.acerto_ganador?'ACERTÓ':'no'}</span></td>
      <td class="mono">${u.aciertos_top4 ?? 0} de 4</td>
    </tr>`;
  });
  cont.innerHTML = html + '</table>';
}

function pintarPesos(pesos){
  const cont = document.getElementById('tabla-pesos');
  if (!pesos.length){ cont.innerHTML = '<div class="estado">Sin datos.</div>'; return; }
  const max = Math.max(...pesos.map(p=>Math.abs(p.valor))) || 1;
  let html = '<table><tr><th>Factor</th><th>Peso actual</th><th></th><th>Actualizado</th></tr>';
  pesos.forEach(p=>{
    const nombre = p.clave.replace(/_/g,' ');
    const ancho = Math.abs(p.valor)/max*100;
    html += `<tr>
      <td>${nombre}</td>
      <td class="mono">${Number(p.valor).toFixed(2)}</td>
      <td><div class="barra-peso"><div style="width:${ancho}%"></div></div></td>
      <td class="mono" style="font-size:11px; opacity:.6;">${p.actualizado_en || ''}</td>
    </tr>`;
  });
  cont.innerHTML = html + '</table>';
}

cargar();
</script>
</body>
</html>
